
<body style='background-color:black'>
<div onkeyup='frameBox.srcdoc = `${htmlBox.value}<script>${jsBox.value}<\/script><style>${cssBox.value}</style>`'>

<textarea
id='htmlBox'
placeholder='HTML'
style='width:400px;height:33%;color:white;background-color:#0f0f0f;resize:none'
spellcheck='false'
></textarea><br>

<textarea
id='jsBox'
placeholder='Javascript'
onkeyup='window.onerror =(m) => log.value = m;eval(jsBox.value)'
style='width:400px;height:33%;color:lightblue;background-color:#0f0f0f;resize:none'
spellcheck='false'
></textarea><br>

<textarea
id='cssBox'
placeholder='CSS'
style='width:400px;height:32%;color:skyblue;background-color:#0f0f0f;resize:none'
spellcheck='false'
></textarea><br>

<button onclick='frameBox.requestFullscreen()'>Fullscreen</button>
<button onclick='createBlob()'>CreateBlob</button><br>
<a id='blobsRES' href
style='color:white;'>link</a>

</div>

<textarea
id='noteBox'
placeholder='Notes/Hint: type"@/show" To give all your code in this box '
style='position:absolute;
top:80.1%;
width:452px;
height:17%;
left:410px;
color:red;
resize:none;
background-color:#0f0f0f'
spellcheck='false'
onkeyup='if(this.value==="@/show"){this.value =frameBox.srcdoc}'
></textarea>

<textarea
id='log'
placeholder='Console'
readonly
style='position:absolute;
top:80.1%;
width:452px;
height:17%;
left:865px;
color:blue;
resize:none;
outline:none;
background-color:#0f0f0f'
spellcheck='false'
onkeyup='if(this.value==="@/show"){this.value =frameBox.srcdoc}'
></textarea>

<iframe
id='frameBox'
style='background-color:white;
width:900px;
position:absolute;
left:410px;
top:8px;
height:78%'
sandbox='allow-scripts allow-forms'
allowFullscreen></iframe>

<script>
    
function createBlob(){
let blobs = new Blob([frameBox.srcdoc],{type:"text/html"});
let urls = URL.createObjectURL(blobs);
blobsRES.href = urls;
}
    
</script>
