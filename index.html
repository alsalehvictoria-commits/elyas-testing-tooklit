


<body style='background-color:black'>
<div onkeyup='frameBox.srcdoc = `${htmlBox.value}<script>${jsBox.value}<\/script><style>${cssBox.value}</style>`'>

<textarea
id='htmlBox'
placeholder='HTML'
style='width:400px;height:33%;color:white;background-color:#0f0f0f;resize:none'
spellcheck='false'
></textarea><br>

<textarea
id='jsBox'
placeholder='Javascript'
onkeyup="try{log.value='';document.write='';new Function(this.value)();}catch(err){log.value=err.message;}"
style='width:400px;height:33%;color:lightblue;background-color:#0f0f0f;resize:none'
spellcheck='false'
></textarea><br>

<textarea
id='cssBox'
placeholder='CSS'
style='width:400px;height:32%;color:skyblue;background-color:#0f0f0f;resize:none'
spellcheck='false'
></textarea><br>

<button onclick='frameBox.requestFullscreen()'
style='background-color:0f0f0f;color:green'
>Fullscreen</button>
<button onclick='createBlob()'
style='background-color:0f0f0f;color:purple'
>CreateBlob</button>
<input 
  placeholder="type your file here..."
  style="background-color:#0f0f0f; color:white;" 
  oninput="Res2.href = this.value"
> 
<button
style='background-color:0f0f0f;cursor:pointer;border:1.5px dimgray outset;box-shadow:dimgray 0px 0px 5px 5px'
><a id="Res2" href="" >🔍</a></button>
<br>

<a 
id='blobsRES' 
href='#'
download='MDN-num.html'
style='color:white;background-color:dimgray;border-radius:4px;border:2px black outset'
>link</a>

</div>

<textarea
id='noteBox'
placeholder='Notes/Hint: type"@/show" To give all your code in this box '
style='position:absolute;
top:80.1%;
width:452px;
height:17%;
left:410px;
color:green;
resize:none;
background-color:#0f0f0f'
spellcheck='false'
onkeyup='if(this.value==="@/show"){this.value =frameBox.srcdoc}'
></textarea>

<textarea
id='log'
placeholder='Console'
readonly
style='position:absolute;
top:80.1%;
width:452px;
height:17%;
left:865px;
color:red;
resize:none;
outline:none;
background-color:#0f0f0f'
spellcheck='false'
onkeyup='if(this.value==="@/show"){this.value =frameBox.srcdoc}'
></textarea>

<iframe
id='frameBox'
style='background-color:white;
width:900px;
position:absolute;
left:410px;
top:8px;
height:78%'
sandbox='allow-scripts allow-forms'
allowFullscreen></iframe>

<script>
    
function createBlob(){
let blobs = new Blob([frameBox.srcdoc],{type:"text/html"});
let urls = URL.createObjectURL(blobs);
blobsRES.href = urls;
}
    
</script>

<head>
<title>MDN UPTE 9</title>
<style>
#htmlBox,#jsBox,#cssBox,#log,#noteBox{
scrollbar-width:thin;
scrollbar-color:#0f0f0f dimgray;
}
</style>
</head>
